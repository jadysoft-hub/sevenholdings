<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Seven Holdings Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#6b6b6b; --line:#d9d9d9; --soft:#f3f3f3;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;background:#000;color:#fff;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .5s ease;
}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:92px;height:92px;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em;animation:fade 1s .35s both}
#splash .bar{width:140px;height:3px;background:#333;border-radius:3px;overflow:hidden}
#splash .bar i{display:block;height:100%;background:#fff;width:0;animation:load 3s linear forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}

/* ---------- Auth ---------- */
#auth{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--bg);overflow:auto;
}
.card{
  width:100%;max-width:400px;border:1.5px solid var(--ink);border-radius:var(--r);
  padding:22px;position:relative;background:#fff;
}
.card::before{content:"";position:absolute;left:-1.5px;top:18px;bottom:18px;width:5px;background:var(--ink);border-radius:0 4px 4px 0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand svg{width:40px;height:40px}
.brand b{font-size:18px;font-weight:800}
.kicker{color:var(--muted);font-size:12px;margin:0 0 4px}
h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;
}
input:focus{border-color:var(--ink)}
.primary{
  width:100%;margin-top:18px;padding:13px;border-radius:12px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;font-weight:800;
}
.primary:disabled{opacity:.5}
.err{color:#000;background:var(--soft);border:1.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px}
.slots{display:flex;gap:6px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center}
.slots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.slots i.f{background:var(--ink)}

/* ---------- App ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
header{
  display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1.5px solid var(--ink);background:#fff;
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;
  display:grid;place-items:center;flex:none;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{background:var(--ink)}
.icon-btn:active svg{stroke:#fff}
.peer{flex:1;min-width:0}
.peer b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.dot.on{background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(0,0,0,.15)}}

#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft);-webkit-overflow-scrolling:touch}
.day{align-self:center;font-size:11px;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:2px 10px;margin:6px 0}
.m{max-width:82%;padding:9px 12px;border-radius:16px;border:1.5px solid var(--ink);word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.m .t{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.m img,.m video,.m iframe{display:block;max-width:100%;border-radius:10px;background:#000;border:0}
.m iframe{width:260px;height:150px}
.m img{cursor:zoom-in;max-height:300px}
.m video{max-height:300px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}

#composer{
  display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1.5px solid var(--ink);background:#fff;
}
#composer input[type=text]{flex:1;min-width:0;border-radius:22px;padding:12px 16px}
.send{width:46px;height:46px;border-radius:50%;background:var(--ink);border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;stroke:#fff}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(92vw,380px);background:#fff;border-right:1.5px solid var(--ink);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:50;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1.5px solid var(--ink)}
.dh b{flex:1;font-size:16px;font-weight:800}
.dtabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.dtabs button{flex:1;padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:700}
.dtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:12px}
.item{border:1.5px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:10px;position:relative;padding-left:16px}
.item::before{content:"";position:absolute;left:-1.5px;top:10px;bottom:10px;width:4px;background:var(--ink);border-radius:0 3px 3px 0}
.item small{display:block;color:var(--muted);font-size:11px}
.item b{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid .g{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1;position:relative}
.grid .g img,.grid .g video{width:100%;height:100%;object-fit:cover;display:block}
.grid .g span{position:absolute;left:6px;bottom:6px;background:#fff;color:#000;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700}
.logrow{font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.logrow time{color:var(--muted);display:block;font-size:11px}
.dfoot{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);display:flex;gap:8px}
.dfoot button{flex:1;padding:11px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:700}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;z-index:95;max-width:90vw}

.m.media{max-width:92%}
.m video{min-width:240px;width:100%}
.m .cap{display:block;font-size:11px;opacity:.7;margin-top:4px}
.ai-tag{display:inline-block;font-size:10px;font-weight:800;border:1.5px solid currentColor;border-radius:8px;padding:0 6px;margin-bottom:4px}
#gbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000;color:#fff;font-size:12px}
#gbar span{flex:1}
#gbar button{background:#fff;color:#000;border:0;border-radius:10px;padding:6px 12px;font-weight:800}
#upbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:#fff;border:1.5px solid #000;border-radius:14px;padding:10px 12px;z-index:70;font-size:12px}
#upbar .b{height:6px;background:#ddd;border-radius:6px;margin-top:6px;overflow:hidden}
#upbar .b i{display:block;height:100%;background:#000;width:0}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #000;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:60;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-top:8px;border:1.5px solid #000;border-radius:14px;background:#fff;font-weight:700}
.sheet button small{display:block;font-weight:400;color:#6b6b6b;font-size:11px}
.sw{width:100%;padding:12px;border:1.5px solid #000;border-radius:12px;background:#fff;font-weight:800;margin-top:8px}
.sw.on{background:#000;color:#fff}
#inv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
#inv .card{max-width:340px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #000;background:#fff;font-weight:800}
.row button.k{background:#000;color:#fff}
#chess{position:fixed;inset:0;background:#fff;z-index:75;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
#chess .top{width:100%;max-width:520px;display:flex;align-items:center;gap:10px}
#chess .top b{flex:1;font-size:15px}
#chess .st{width:100%;max-width:520px;border:1.5px solid #000;border-radius:14px;padding:10px 12px;font-weight:800;text-align:center}
#chess .mv{width:100%;max-width:520px;font-size:11px;color:#6b6b6b;max-height:48px;overflow:auto;text-align:center}
.board{--bs:min(calc(100vw - 24px),calc(100dvh - 290px),520px);width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #000;border-radius:6px;overflow:hidden;touch-action:manipulation}
.sq{display:grid;place-items:center;font-size:calc(var(--bs)/8*.82);line-height:1;position:relative;user-select:none;cursor:pointer}
.sq.l{background:#dcdcdc}.sq.d{background:#8a8a8a}
.sq.last{box-shadow:inset 0 0 0 3px rgba(0,0,0,.55)}
.sq.sel{box-shadow:inset 0 0 0 4px #000;background:#fff}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.6)}
.sq.cap2{box-shadow:inset 0 0 0 4px #000}
.pw{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 3px #000}
.pb{color:#000;text-shadow:0 0 1px rgba(255,255,255,.5)}
#chess .foot{display:flex;gap:8px;width:100%;max-width:520px}
#chess .foot button{flex:1;padding:12px;border:1.5px solid #000;border-radius:12px;background:#fff;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vid{min-width:240px}
.vid .cap{display:block;font-size:11px;opacity:.75;margin-top:4px}
.getv{width:100%;padding:12px;border-radius:12px;border:1.5px solid currentColor;background:transparent;font-weight:800}
.grid .g .vid{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;background:#fff;color:#000;padding:6px;min-width:0}
.grid .g .vid video{height:auto;max-height:80%}
#ind{padding:6px 14px;font-size:12px;color:#444;background:var(--soft);border-top:1px dashed var(--line)}
.indrow{display:flex;align-items:center;gap:6px;padding:2px 0}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:#000;animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{40%{transform:translateY(-4px);opacity:.4}}
.ld{display:inline-flex;gap:4px;margin-top:6px}.ld i{width:7px;height:7px;background:currentColor;opacity:.25;animation:sqb 1s infinite}
.ld i:nth-child(2){animation-delay:.12s}.ld i:nth-child(3){animation-delay:.24s}.ld i:nth-child(4){animation-delay:.36s}.ld i:nth-child(5){animation-delay:.48s}
@keyframes sqb{40%{opacity:1;transform:translateY(-3px)}}
.indrow .ld{margin-top:0}
.m.asst{align-self:center;max-width:94%;background:#fff;color:#000;border-style:dashed;white-space:pre-wrap}
.m.asst a{color:#000;text-decoration:underline}
.m .src{display:block;font-size:11px;margin-top:6px;opacity:.85;white-space:normal}
#recbar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1.5px solid #000;background:#fff;font-weight:800}
#recbar button{padding:11px 16px;border:1.5px solid #000;border-radius:12px;background:#fff;font-weight:800}
#recbar button.k{background:#000;color:#fff}
.rdot{width:12px;height:12px;border-radius:50%;background:#000;animation:pulse 1s infinite}
.m audio{width:230px;max-width:100%;display:block}
.vid audio{width:100%}
.sbtn{padding:0 16px;border:1.5px solid #000;border-radius:12px;background:#000;color:#fff;font-weight:800}
#dbody a{color:#000}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="21" y="5" width="22" height="14" rx="3"/>
    <path d="M32 19v8M14 27h36M14 27v7M50 27v7"/>
    <rect x="4" y="34" width="20" height="12" rx="6"/><path d="M4 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
    <rect x="40" y="34" width="20" height="12" rx="6"/><path d="M40 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
  </svg>
  <h1>Seven Holdings Inc.</h1>
  <div class="bar"><i></i></div>
</div>

<!-- Auth -->
<div id="auth" class="hidden">
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="21" y="5" width="22" height="14" rx="3"/><path d="M32 19v8M14 27h36M14 27v7M50 27v7"/>
        <rect x="4" y="34" width="20" height="12" rx="6"/><path d="M4 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
        <rect x="40" y="34" width="20" height="12" rx="6"/><path d="M40 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
      </svg>
      <b>Seven Holdings Inc.</b>
    </div>
    <p class="kicker">Özel mesajlaşma</p>
    <h2 id="authTitle">Giriş yap</h2>
    <p class="sub">Yalnızca iki hesap oluşturulabilir. Mesajlar uçtan uca şifrelidir.</p>
    <div class="tabs">
      <button id="tabLogin" class="on">Giriş</button>
      <button id="tabReg">Kayıt</button>
    </div>
    <label for="u">Kullanıcı adı</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="p">Şifre</label>
    <input id="p" type="password" autocomplete="current-password">
    <div id="authErr" class="err hidden"></div>
    <button id="authBtn" class="primary">Giriş yap</button>
    <div class="slots" id="slots"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="peer">
      <b id="peerName">Bekleniyor…</b>
      <span><i class="dot" id="peerDot"></i><em id="peerStatus" style="font-style:normal">çevrimdışı</em></span>
    </div>
    <button class="icon-btn" id="muteBtn" aria-label="Ses">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <div id="gbar" class="hidden"><span id="gbarTxt"></span><button id="gbarBtn">Oyuna dön</button></div>
  <div id="msgs"></div>
  <div id="ind" class="hidden"></div>

  <form id="composer" autocomplete="off">
    <button type="button" class="icon-btn" id="plusBtn" aria-label="Ekle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" class="hidden">
    <input type="file" id="vfile" accept="video/*" class="hidden">
    <input type="text" id="txt" placeholder="Mesaj yaz" enterkeyhint="send">
    <button type="button" class="icon-btn" id="micBtn" aria-label="Sesli mesaj"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="send" type="submit" aria-label="Gönder">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div id="recbar" class="hidden"><i class="rdot"></i><span id="recT">0:00</span><span style="flex:1">kaydediliyor…</span><button type="button" id="recCancel">İptal</button><button type="button" id="recSend" class="k">Gönder</button></div>
</div>

<!-- Drawer -->
<div id="scrim"></div>
<aside id="drawer">
  <div class="dh">
    <b>Seven Holdings Inc.</b>
    <button class="icon-btn" id="closeDrawer" aria-label="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dtabs">
    <button data-t="users" class="on">Kişiler</button>
    <button data-t="search">Ara</button>
    <button data-t="media">Medya</button>
    <button data-t="log">Etkinlik</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot"><button id="logout">Çıkış yap</button></div>
</aside>

<div id="lightbox" class="hidden"></div>
<div id="sheetScrim" class="hidden" style="position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.4)"></div>
<div class="sheet" id="sheet">
  <button id="shImg"><b>Fotoğraf</b></button>
  <button id="shVid"><span><b>Video yükle</b><small>Doğrudan karşı cihaza gider, hiçbir yerde saklanmaz. Gönderirken ikiniz de çevrimiçi olun.</small></span></button>
  <button id="shLink"><span><b>Video bağlantısı</b><small>mp4 veya YouTube linki</small></span></button>
  <button id="shChess"><span><b>Satranç oyna</b><small>Karşı taraf çevrimiçiyse davet gönder</small></span></button>
</div>
<div id="inv" class="hidden"><div class="card"><p class="kicker">Oyun daveti</p><h2 id="invT" style="font-size:20px"></h2><div class="row"><button id="invNo">Reddet</button><button id="invYes" class="k">Kabul et</button></div></div></div>
<div id="upbar" class="hidden"><span id="upTxt"></span><div class="b"><i id="upFill"></i></div></div>
<div id="chess" class="hidden">
  <div class="top"><b id="chT"></b></div>
  <div class="st" id="chSt"></div>

/* ---------- Ses efektleri (WebAudio) ---------- */
let AC;
function tone(seq){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    let t = AC.currentTime;
    seq.forEach(([f,d,type='sine',v=.15])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
      t+=d*.8;
    });
  }catch(e){}
}

/* ---------- JSONBin ---------- */
async function jb(method, path, body, extra={}){
  const r = await fetch(API+path,{
    method,
    headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY,'X-Bin-Meta':'false',...extra},
    body: body?JSON.stringify(body):undefined
  });
  if(!r.ok){
    let m=''; try{ m=(await r.json()).message }catch(e){}
    throw new Error('JSONBin '+r.status+' '+m);
  }
  return r.json();
}
async function ensureBin(){
  if(binId) return;
  try{
    const list = await fetch(API+'/c/uncategorized/bins',{headers:{'X-Master-Key':MASTER_KEY}}).then(r=>r.ok?r.json():[]);
    const found = (Array.isArray(list)?list:[]).find(b=>b.snippetMeta && b.snippetMeta.name===BIN_NAME);
    if(found){ binId=found.record; }
  }catch(e){}
  if(!binId){
    const created = await fetch(API+'/b',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY,'X-Bin-Name':BIN_NAME,'X-Bin-Private':'true'},
      body:JSON.stringify({users:{},messages:[],log:[]})
    }).then(r=>r.json());
    binId = created.metadata.id;
  }
  localStorage.setItem('sh_bin',binId);
}
async function readDb(){
  await ensureBin();
  const d = await jb('GET','/b/'+binId+'/latest');
  d.users=d.users||{}; d.messages=d.messages||[]; d.log=d.log||[];
  return d;
}
let queue = Promise.resolve();
function mutate(fn){
  const run = async()=>{
    const d = await readDb();
    fn(d);
    d.log = d.log.slice(-60);
    while(JSON.stringify(d).length > MAX_BYTES && d.messages.length>1) d.messages.shift();
    await jb('PUT','/b/'+binId, d);
    db = d;
    return d;
  };
  const p = queue.then(run, run);
  queue = p.catch(()=>{});
  return p;
}

/* ---------- Yardımcılar ---------- */
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hm  = ts => new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const dm  = ts => new Date(ts).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const full= ts => new Date(ts).toLocaleString('tr-TR');
const isOnline = u => u && (Date.now()-(u.lastSeen||0) < ONLINE_MS);
function peer(){ const n=Object.keys(db.users).find(k=>k!==(me&&me.u)); return n?{name:n,...db.users[n]}:null; }

/* ---------- Yerel depolama (IndexedDB): anahtar + video dosyaları ---------- */
let _idb;
function idb(){ return _idb||(_idb=new Promise((res,rej)=>{ const r=indexedDB.open('sh',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbPut(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }

/* ---------- Şifreleme (uçtan uca: ECDH P-256 + AES-256-GCM) ---------- */
const te=new TextEncoder();
const b64=u=>{ let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const ECDH={name:'ECDH',namedCurve:'P-256'};
let myPriv=null, skCache={sig:'',key:null}, keyWarn=false;
const dcache=new Map();

async function kdf(pw,salt){
  const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:250000,hash:'SHA-256'},k,512));
  return { auth:hex(bits.slice(0,32)), wrap:await crypto.subtle.importKey('raw',bits.slice(32),'AES-GCM',false,['encrypt','decrypt']) };
}
async function newIdentity(pw){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const {auth,wrap}=await kdf(pw,salt);
  const kp=await crypto.subtle.generateKey(ECDH,true,['deriveKey','deriveBits']);
  const jwk=await crypto.subtle.exportKey('jwk',kp.publicKey);
  const pk8=new Uint8Array(await crypto.subtle.exportKey('pkcs8',kp.privateKey));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},wrap,pk8));
  return { rec:{salt,auth,pub:{x:jwk.x,y:jwk.y},wpriv:b64(iv)+'.'+b64(ct)}, pk8 };
}
const importPriv=pk8=>crypto.subtle.importKey('pkcs8',pk8,ECDH,false,['deriveKey','deriveBits']);

async function sharedKey(){
  const p=peer(); if(!p||!p.pub||!myPriv) return null;
  const sig=p.pub.x+p.pub.y;
  if(skCache.sig===sig) return skCache.key;
  const pub=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:p.pub.x,y:p.pub.y,ext:true},ECDH,false,[]);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:pub},myPriv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  skCache={sig,key}; return key;
}
async function encPayload(key,id,from,ts,payload){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(id+'|'+from+'|'+ts)},key,te.encode(JSON.stringify(payload))));
  return b64(iv)+'.'+b64(ct);
}
async function decMsg(m,key){
  if(!m.e) return {type:m.type,text:m.text,data:m.data,ai:m.ai,legacy:1};
  if(!key) return null;
  try{
    const [iv,ct]=m.e.split('.').map(unb64);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:te.encode(m.id+'|'+m.from+'|'+m.ts)},key,ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return {type:'text',text:'[mesaj çözülemedi]',bad:true}; }
}
async function decryptAll(){
  const key=await sharedKey();
  for(const m of db.messages){
    if(dcache.has(m.id)) continue;
    const P=await decMsg(m,key); if(P) dcache.set(m.id,P);
  }
}
async function safetyCode(){
  const p=peer(), mine=db.users[me.u];
  if(!p||!p.pub||!mine||!mine.pub) return null;
  const a=[mine.pub.x+mine.pub.y,p.pub.x+p.pub.y].sort().join('|');
  const h=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(a))));
  return h.slice(0,20).match(/.{4}/g).join(' ');
}
function checkPeerKey(){

}

$('#authBtn').onclick = async ()=>{
  const u = $('#u').value.trim().toLowerCase();

  if(!/^[a-z0-9_.-]+$/.test(u)) return showErr('Kullanıcı adında yalnızca harf, rakam, _ . - kullan.');
  if(mode==='reg' && p.length<8) return showErr('Şifre en az 8 karakter olmalı. Şifreni unutursan mesajlar açılamaz.');
  if(!p) return showErr('Şifre gerekli.');
  const btn=$('#authBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='Anahtarlar hazırlanıyor…';
  try{
    if(mode==='reg'){
      const {rec,pk8}=await newIdentity(p); let err=null;
      await mutate(d=>{
        if(d.users[u]){ err='Bu kullanıcı adı zaten alınmış.'; return; }
        if(Object.keys(d.users).length>=MAX_USERS){ err='Kayıt dolu. En fazla '+MAX_USERS+' kullanıcı kayıt olabilir.'; return; }
        d.users[u]={...rec,created:Date.now(),lastSeen:Date.now()};

      });

        const {auth,wrap}=await kdf(p,usr.salt);
        if(auth!==usr.auth) return showErr('Kullanıcı adı veya şifre hatalı.');
        const [iv,ct]=usr.wpriv.split('.').map(unb64);
        const pk8=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},wrap,ct));
        myPriv=await importPriv(pk8); await idbPut('priv:'+u,myPriv); me={u,h:auth};
      }else{ // eski sürümden kalan hesap: şifreleme anahtarına yükselt
        if(usr.hash!==await sha(u+':'+p)) return showErr('Kullanıcı adı veya şifre hatalı.');
        const {rec,pk8}=await newIdentity(p);
        await mutate(x=>{ Object.assign(x.users[u],rec); delete x.users[u].hash; x.log.push({ts:Date.now(),u,e:'şifreleme anahtarı oluşturuldu'}); });
        myPriv=await importPriv(pk8); await idbPut('priv:'+u,myPriv); me={u,h:rec.auth};
      }
      await mutate(x=>{ x.users[u].lastSeen=Date.now(); x.log.push({ts:Date.now(),u,e:'giriş yaptı'}); });
    }
    localStorage.setItem('sh_me',JSON.stringify(me));

  finally{ btn.disabled=false; btn.textContent=old; }
};

let pollT, beatT, firstRender=true, R={n:0,first:null,day:''};
const fastPoll = () => (db.game && (db.game.status==='playing'||db.game.status==='invite')) || db.rtc || rx || tx || peerTyping() || (db.aijob&&db.aijob.busy) || (db.messages.length && Date.now()-db.messages.at(-1).ts<45000);
function loop(){

const pending=new Set();

function renderMsgs(){

function ytId(u){

async function postMsg(id,from,ts,payload,logText){
  const key=await sharedKey(); if(!key) throw new Error('şifreleme anahtarı yok');
  const e=await encPayload(key,id,from,ts,payload);
  dcache.set(id,payload);
  const m={id,from,ts,e};
  pending.add(id); db.messages.push(m); render();
  try{

  }

}

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let max=360, q=.6, out;
      do{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        max-=40; q-=.08;
      }while(out.length>28000 && max>120);
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror=rej; img.src=url;
  });
}

/* ---------- Video: cihazdan cihaza (WebRTC), hiçbir sunucuda saklanmaz ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let rx=null, tx=null, servedId=null;
function setProg(txt,pct){ $('#upbar').classList.remove('hidden'); $('#upTxt').textContent=txt; $('#upFill').style.width=Math.max(0,Math.min(100,pct))+'%'; }
function hideProg(){ $('#upbar').classList.add('hidden'); }
function waitIce(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res,5000);
    pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } };
  });
}
$('#vfile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(!f.type.startsWith('video/')) return toast('Lütfen bir video dosyası seç');
  const id=uid();
  try{
    await idbPut('f:'+id,f);
    await send({type:'video',name:f.name,size:f.size,mime:f.type||'video/mp4'},id);
    toast('Video hazır. Karşı taraf "Videoyu al" dediğinde uygulamanı açık tut.');
  }catch(err){ toast('Video eklenemedi: '+err.message); }
};
async function requestVideo(ds){
  if(rx) return toast('Zaten bir video alınıyor');
  const p=peer();
  if(!isOnline(p)){ SFX.err(); return toast('Gönderen çevrimdışı. O çevrimiçiyken tekrar dene.'); }
  if(!window.RTCPeerConnection){ return toast('Tarayıcın WebRTC desteklemiyor'); }
  const id=ds.id; setProg('Gönderenle bağlantı kuruluyor…',2);
  try{
    const pc=new RTCPeerConnection(ICE), ch=pc.createDataChannel('v',{ordered:true});
    ch.binaryType='arraybuffer';
    rx={id,pc,ch,chunks:[],got:0,size:+ds.size,mime:ds.mime||'video/mp4',answered:false,t0:Date.now(),open:false};
    ch.onopen=()=>{ rx&&(rx.open=true); };
    ch.onmessage=ev=>{
      if(!rx) return;
      if(typeof ev.data==='string'){ const h=JSON.parse(ev.data); if(h.done) finishRx(); return; }
      rx.chunks.push(ev.data); rx.got+=ev.data.byteLength;
      const pr=rx.size?rx.got/rx.size*100:0;
      setProg(`Video alınıyor… %${Math.round(pr)} (${(rx.got/1048576).toFixed(1)} MB)`,pr);
    };
    pc.onconnectionstatechange=()=>{ if(rx&&rx.pc===pc&&['failed','disconnected'].includes(pc.connectionState)&&!rx.finished) failRx('Bağlantı koptu'); };
    await pc.setLocalDescription(await pc.createOffer());
    await waitIce(pc);
    const rid=uid();
    rx.rtcId=rid;
    await mutate(d=>{ d.rtc={id:rid,msg:id,from:me.u,to:ds.from,offer:pc.localDescription.sdp,ts:Date.now()}; });
    loop();
  }catch(e){ failRx('Başlatılamadı: '+e.message); }
}
function failRx(msg){
  if(rx){ try{rx.pc.close();}catch(e){} rx=null; }
  hideProg(); SFX.err(); toast(msg);
  mutate(d=>{ d.rtc=null; }).catch(()=>{});
}
async function finishRx(){
  if(!rx||rx.finished) return; rx.finished=true;
  const {id,chunks,mime,size}=rx;
  const blob=new Blob(chunks,{type:mime});
  if(size && blob.size!==size){ rx.finished=false; return failRx('Video eksik geldi, tekrar dene'); }
  await idbPut('f:'+id,blob);
  try{ rx.pc.close(); }catch(e){}
  rx=null; hideProg(); SFX.ok(); toast('Dosya alındı');
  document.querySelectorAll('.vid').forEach(el=>{ if(el.dataset.id===id) el.classList.remove('ok'); });
  hydrate(document);
  mutate(d=>{ d.rtc=null; }).catch(()=>{});
}
async function rtcTick(){
  const r=db.rtc;
  // alıcı: yanıt geldi mi?
  if(rx){
    if(r && r.id===rx.rtcId){
      if(r.err){ return failRx('Gönderen bu videoyu bulamadı (dosya o cihazda yok)'); }
      if(r.answer && !rx.answered){
        rx.answered=true;
        try{ await rx.pc.setRemoteDescription({type:'answer',sdp:r.answer}); }catch(e){ return failRx('Bağlantı kurulamadı'); }
      }
    }
    const age=Date.now()-rx.t0;
    if(!rx.answered && age>35000) return failRx('Gönderen yanıt vermedi. Uygulaması açık mı?');
    if(rx.answered && !rx.open && age>60000) return failRx('Doğrudan bağlantı kurulamadı (ağ engelliyor olabilir)');
    return;
  }
  // gönderici: istek var mı?
  if(r && r.to===me.u && r.offer && !r.answer && !r.err && !tx && r.id!==servedId){
    servedId=r.id;
    const file=await idbGet('f:'+r.msg).catch(()=>null);
    if(!file){ mutate(d=>{ if(d.rtc&&d.rtc.id===r.id) d.rtc.err=1; }).catch(()=>{}); return; }
    try{
      const pc=new RTCPeerConnection(ICE); tx={pc};
      setProg('Video gönderimi başlıyor…',2);
      pc.ondatachannel=ev=>{ const ch=ev.channel; ch.onopen=()=>sendFile(ch,file); };
      pc.onconnectionstatechange=()=>{ if(['failed','closed'].includes(pc.connectionState)){ tx=null; hideProg(); } };
      await pc.setRemoteDescription({type:'offer',sdp:r.offer});
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(pc);
      await mutate(d=>{ if(d.rtc&&d.rtc.id===r.id) d.rtc.answer=pc.localDescription.sdp; });
    }catch(e){ tx=null; hideProg(); }
  }
}
async function sendFile(ch,file){
  ch.send(JSON.stringify({name:file.name,size:file.size}));
  ch.bufferedAmountLowThreshold=1<<20;
  const CH=16384, BIG=1<<20; let off=0;
  while(off<file.size){
    const big=new Uint8Array(await file.slice(off,off+BIG).arrayBuffer());
    for(let i=0;i<big.length;i+=CH){
      if(ch.readyState!=='open') return;
      if(ch.bufferedAmount>4*1048576) await new Promise(r=>{ ch.onbufferedamountlow=()=>{ ch.onbufferedamountlow=null; r(); }; });
      ch.send(big.subarray(i,i+CH));
    }
    off+=big.length;
    setProg(`Video gönderiliyor… %${Math.round(off/file.size*100)}`,off/file.size*100);
  }
  ch.send(JSON.stringify({done:1}));
  while(ch.bufferedAmount>0 && ch.readyState==='open') await new Promise(r=>setTimeout(r,200));
  setTimeout(()=>{ try{ tx&&tx.pc.close(); }catch(e){} tx=null; hideProg(); toast('Video gönderildi'); },2500);
}

let rec=null;
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function startRec(){
  const p=peer();
  if(!p||!p.pub){ SFX.err(); return toast('Karşı kullanıcı kayıt olup giriş yapınca mesaj gönderebilirsin'); }
  if(!navigator.mediaDevices||!window.MediaRecorder){ SFX.err(); return toast('Bu tarayıcı ses kaydını desteklemiyor'); }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:12000}:{audioBitsPerSecond:12000});
    rec={mr,stream,chunks:[],t0:Date.now(),cancel:false,mime:mr.mimeType||mime||'audio/webm'};
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) rec&&rec.chunks.push(e.data); };
    const r=rec; mr.onstop=()=>finishRec(r);
    mr.start(1000);
    $('#composer').classList.add('hidden'); $('#recbar').classList.remove('hidden');
    SFX.click();
    r.tm=setInterval(()=>{ const s=(Date.now()-r.t0)/1000; $('#recT').textContent=fmtT(s); if(s>=180) stopRec(false); },250);
  }catch(e){ SFX.err(); toast('Mikrofon izni verilmedi veya kullanılamıyor'); }
}
function stopRec(cancel){ if(!rec) return; rec.cancel=cancel; try{ rec.mr.stop(); }catch(e){} }
async function finishRec(r){
  clearInterval(r.tm); r.stream.getTracks().forEach(t=>t.stop());
  $('#recbar').classList.add('hidden'); $('#composer').classList.remove('hidden'); $('#recT').textContent='0:00';
  rec=null;
  if(r.cancel) return;
  const dur=Math.round((Date.now()-r.t0)/1000);
  if(dur<1||!r.chunks.length) return toast('Kayıt çok kısa');
  const blob=new Blob(r.chunks,{type:r.mime});
  const dataUrl=await new Promise(res=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.readAsDataURL(blob); });
  if(dataUrl.length<=20000) send({type:'audio',dur,mime:r.mime,data:dataUrl});
  else{
    const id=uid(); await idbPut('f:'+id,blob);
    send({type:'audio',dur,mime:r.mime,size:blob.size,p2p:1},id);
    toast('Uzun ses kaydı: karşı taraf "Sesi al" dediğinde uygulamanı açık tut.');
  }
}

const WX={0:'açık',1:'çoğunlukla açık',2:'parçalı bulutlu',3:'kapalı',45:'sisli',48:'kırağılı sis',51:'hafif çise',53:'çise',55:'yoğun çise',56:'dondurucu çise',57:'dondurucu çise',61:'hafif yağmur',63:'yağmur',65:'şiddetli yağmur',66:'dondurucu yağmur',67:'dondurucu yağmur',71:'hafif kar',73:'kar',75:'yoğun kar',77:'kar taneleri',80:'hafif sağanak',81:'sağanak',82:'şiddetli sağanak',85:'kar sağanağı',86:'yoğun kar sağanağı',95:'gök gürültülü fırtına',96:'dolu ile fırtına',99:'şiddetli dolu ile fırtına'};
async function postWeather(w){
  const A=me.u, B=peer().name;
  const j=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1`).then(r=>r.json());
  if(!j.daily||!j.current) throw new Error('hava verisi alınamadı');
  const mx=Math.round(j.daily.temperature_2m_max[0]), mn=Math.round(j.daily.temperature_2m_min[0]);
  const cur=Math.round(j.current.temperature_2m), pp=j.daily.precipitation_probability_max[0], wind=Math.round(j.current.wind_speed_10m);
  const desc=WX[j.daily.weather_code[0]]||'değişken';
  const tips=[];
  if(pp>=50) tips.push('Şemsiye almayı unutmayın.');
  if(mx>=32) tips.push('Çok sıcak olacak, bol su için.');
  if(mn<=3) tips.push('Soğuk olacak, kalın giyinin.');
  if(wind>=40) tips.push('Rüzgar sert esiyor, dikkatli olun.');
  const hi=new Date().getHours()<12?'Günaydın':'Merhaba';
  const text=`${hi} ${A} ve ${B}! ${w.city} için bugün: ${desc}, ${mn}–${mx}°C (şu an ${cur}°C), yağış ihtimali %${pp??0}, rüzgar ${wind} km/s.`+(tips.length?'\n'+tips.join(' '):'');
  await postMsg(uid(),A,Date.now(),{type:'text',text,asst:A,wx:1,src:[{t:'Open-Meteo',u:'https://open-meteo.com/'}]},A+' asistanı hava durumunu paylaştı');
  SFX.recv();
}

async function weatherTick(){
  const w=db.weather;

  const today=new Date().toLocaleDateString('sv-SE');
  if(w.last===today||new Date().getHours()<7) return;
  wxRun=true; let claimed=false;

    await mutate(d=>{ if(!d.weather||d.weather.last===today) return; d.weather.prev=d.weather.last||null; d.weather.last=today; claimed=true; });
    if(claimed){
      try{ await postWeather(db.weather); }
      catch(e){ await mutate(d=>{ if(d.weather&&d.weather.last===today) d.weather.last=d.weather.prev||null; }).catch(()=>{}); }
    }
  }catch(e){} finally{ wxRun=false; }
}

async function llm(system,msgs,opt={}){
  if(ANTHROPIC_KEY){
    const body={model:AI_MODEL,max_tokens:opt.search?900:400,system,messages:msgs};
    if(opt.search) body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    const j=await r.json(); if(j.error) throw new Error(j.error.message);
    let text='', src=[];
    for(const b of j.content||[]){
      if(b.type==='text') text+=b.text;
      if(b.type==='web_search_tool_result'&&Array.isArray(b.content)) b.content.forEach(x=>{ if(x.url&&!src.find(s=>s.u===x.url)) src.push({t:x.title||x.url,u:x.url}); });
    }
    return {text:text.trim(),sources:src.slice(0,4)};
  }
  const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:system},...msgs]})});
  const j=await r.json();
  return {text:((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim(),sources:[]};
}
async function wikiResearch(queries){
  const docs=[], seen=new Set();
  for(const lang of ['tr','en']){
    for(const q of queries.slice(0,2)){
      if(docs.length>=3) break;
      try{
        const s=await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=2&format=json&origin=*`).then(r=>r.json());
        const ids=((s.query&&s.query.search)||[]).map(x=>x.pageid).filter(id=>!seen.has(lang+id));
        if(!ids.length) continue;
        ids.forEach(id=>seen.add(lang+id));
        const e=await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exchars=1100&pageids=${ids.join('|')}&format=json&origin=*`).then(r=>r.json());
        for(const pg of Object.values((e.query&&e.query.pages)||{})){
          if(pg.extract&&docs.length<3) docs.push({t:pg.title+' (Vikipedi '+lang+')',u:pg.fullurl,x:pg.extract});
        }
      }catch(err){}
    }
    if(docs.length>=2) break;
  }
  return docs;
}
async function assistantTick(){
  if(aiRun||!me||!bothAsst()||keyWarn) return;
  const now=Date.now(), B=peer().name, j=db.aijob;
  // 2. asistan: eş asistanın araştırmasına kendi kullanıcısı için kısa bir ek
  const res=textItems().reverse().find(x=>x.P.res&&x.P.asst===B);
  if(res && now-res.m.ts<5*60000 && res.m.id!==lastAck && !(j&&j.ack===res.m.id)){
    lastAck=res.m.id; aiRun=true; let claimed=false;
    try{
      await mutate(d=>{ if(d.aijob&&d.aijob.ack===res.m.id) return; d.aijob={...(d.aijob||{}),ack:res.m.id}; claimed=true; });
      if(claimed) await followUp();
    }catch(e){} finally{ aiRun=false; aiLocal=null; renderInd(); }
    return;
  }
  // 1. asistan: sohbet duraksayınca konuyu belirle ve araştır
  const hum=textItems().filter(x=>!x.P.ai&&!x.P.asst&&now-x.m.ts<10*60000);
  const idx=(j&&j.upto)?hum.findIndex(x=>x.m.id===j.upto):-1;
  const fresh=hum.slice(idx+1);
  if(!fresh.length) return;
  const last=fresh.at(-1);
  if(now-last.m.ts<6000) return;
  if(!(fresh.length>=2 || TRIG.test(last.P.text))) return;
  if(j && ((j.busy&&now-j.ts<90000) || now-j.ts<45000)) return;
  aiRun=true; let claimed=false;
  try{
    await mutate(d=>{ if(d.aijob&&d.aijob.upto===last.m.id) return; d.aijob={upto:last.m.id,by:me.u,ts:Date.now(),busy:true,label:'konuyu inceliyor'}; claimed=true; });
    if(claimed) await runResearch(last.m.id,hum.slice(-12));
  }catch(e){ toast('Asistan çalışamadı: '+e.message); }
  finally{ aiRun=false; aiLocal=null; renderInd(); }
}
async function runResearch(upto,ctx){
  const A=me.u, B=peer().name;

  const finish=()=>mutate(d=>{ if(d.aijob&&d.aijob.upto===upto) d.aijob.busy=false; }).catch(()=>{});
  const label=l=>{ aiLocal={label:l}; renderInd(); mutate(d=>{ if(d.aijob&&d.aijob.upto===upto) d.aijob.label=l; }).catch(()=>{}); };
  aiLocal={label:'konuyu inceliyor'}; renderInd();
  try{
    const c=await llm('Bir sohbeti okuyup, arkadaşların internetten araştırabileceği somut bir konu olup olmadığına karar veren bir sınıflandırıcısın. Yalnızca JSON döndür: {"need":true|false,"topic":"kısa konu","queries":["arama 1","arama 2"]}. Selamlaşma, gündelik ve kişisel sohbet için need=false. En fazla 2 kısa arama sorgusu ver.',[{role:'user',content:convo}]);
    let jx={}; try{ jx=JSON.parse((c.text.match(/\{[\s\S]*\}/)||['{}'])[0]); }catch(e){}
    if(!jx.need||!Array.isArray(jx.queries)||!jx.queries.length){ await finish(); return; }
    label('araştırıyor: '+String(jx.topic||'').slice(0,40));
    const sys=`Sen ${A}'nın asistanısın ve ${A} ile ${B}'nin sohbetinde konuşulan konuyu az önce araştırdın. Türkçe yaz, ikisine de adlarıyla hitap et (örn. "${A} ve ${B}, ..."). Kısa ve net ol: en fazla 6 cümle veya 4 madde. Bilmediğin veya kaynaklarda olmayan bir şeyi kesin bilgi gibi söyleme.`;
    let out, src=[];

      out=await llm(sys+' İnternette ara ve bulduklarını özetle.',[{role:'user',content:`Sohbet:\n${convo}\n\nKonu: ${jx.topic}`}],{search:true});

      else{

/* ---------- Satranç motoru ---------- */
const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
function initState(){
  const b=Array(64).fill(null), back='RNBQKBNR';
  for(let c=0;c<8;c++){ b[c]='b'+back[c]; b[8+c]='bP'; b[48+c]='wP'; b[56+c]='w'+back[c]; }
  return {b,t:'w',c:{wK:1,wQ:1,bK:1,bQ:1},ep:-1};
}
const opp=c=>c==='w'?'b':'w';
const KN=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const DG=[[-1,-1],[-1,1],[1,-1],[1,1]], OR=[[-1,0],[1,0],[0,-1],[0,1]];
function attacked(b,sq,by){
  const r=sq>>3,c=sq&7;
  const pr=by==='w'?r+1:r-1;
  if(pr>=0&&pr<8) for(const dc of [-1,1]){ const cc=c+dc; if(cc>=0&&cc<8&&b[pr*8+cc]===by+'P') return true; }
  for(const [dr,dc] of KN){ const rr=r+dr,cc=c+dc; if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===by+'N') return true; }
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const rr=r+dr,cc=c+dc; if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===by+'K') return true; }
  for(const [dirs,types] of [[DG,'BQ'],[OR,'RQ']]){
    for(const [dr,dc] of dirs){
      let rr=r+dr,cc=c+dc;
      while(rr>=0&&rr<8&&cc>=0&&cc<8){
        const p=b[rr*8+cc];
        if(p){ if(p[0]===by && types.includes(p[1])) return true; break; }
        rr+=dr; cc+=dc;
      }
    }
  }
  return false;
}
function pseudo(s,color){
  const b=s.b, out=[], o=opp(color);
  const add=(f,t,x={})=>out.push({f,t,...x});
  for(let sq=0;sq<64;sq++){
    const p=b[sq]; if(!p||p[0]!==color) continue;
    const ty=p[1], r=sq>>3, c=sq&7;
    if(ty==='P'){
      const dir=color==='w'?-1:1, start=color==='w'?6:1, last=color==='w'?0:7, one=r+dir;
      const push=(t,x={})=>{ if(one===last) ['Q','R','B','N'].forEach(pr=>add(sq,t,{...x,pr})); else add(sq,t,x); };
      if(one>=0&&one<8){
        if(!b[one*8+c]){
          push(one*8+c);
          if(r===start && !b[(r+2*dir)*8+c]) add(sq,(r+2*dir)*8+c,{dbl:1});
        }
        for(const dc of [-1,1]){
          const cc=c+dc; if(cc<0||cc>7) continue; const t=one*8+cc;
          if(b[t]&&b[t][0]===o) push(t,{cap:1});
          else if(!b[t]&&t===s.ep) add(sq,t,{ep:1,cap:1});
        }
      }
    }else if(ty==='N'||ty==='K'){
      const offs=ty==='N'?KN:[...DG,...OR];
      for(const [dr,dc] of offs){
        const rr=r+dr,cc=c+dc; if(rr<0||rr>7||cc<0||cc>7) continue;
        const t=rr*8+cc; if(!b[t]) add(sq,t); else if(b[t][0]===o) add(sq,t,{cap:1});
      }
      if(ty==='K' && c===4 && r===(color==='w'?7:0)){
        if(s.c[color+'K'] && !b[sq+1]&&!b[sq+2]&&b[sq+3]===color+'R' && !attacked(b,sq,o)&&!attacked(b,sq+1,o)&&!attacked(b,sq+2,o)) add(sq,sq+2,{castle:'K'});
        if(s.c[color+'Q'] && !b[sq-1]&&!b[sq-2]&&!b[sq-3]&&b[sq-4]===color+'R' && !attacked(b,sq,o)&&!attacked(b,sq-1,o)&&!attacked(b,sq-2,o)) add(sq,sq-2,{castle:'Q'});
      }
    }else{
      const dirs=ty==='B'?DG:ty==='R'?OR:[...DG,...OR];
      for(const [dr,dc] of dirs){
        let rr=r+dr,cc=c+dc;
        while(rr>=0&&rr<8&&cc>=0&&cc<8){
          const t=rr*8+cc;
          if(!b[t]) add(sq,t); else { if(b[t][0]===o) add(sq,t,{cap:1}); break; }
          rr+=dr; cc+=dc;
        }
      }
    }
  }
  return out;
}
function applyMove(s,m){
  const b=s.b.slice(), p=b[m.f], col=p[0];
  b[m.t]=p; b[m.f]=null;
  if(m.ep) b[m.t+(col==='w'?8:-8)]=null;
  if(m.castle==='K'){ b[m.f+1]=b[m.f+3]; b[m.f+3]=null; }
  if(m.castle==='Q'){ b[m.f-1]=b[m.f-4]; b[m.f-4]=null; }
  if(m.pr) b[m.t]=col+m.pr;
  const c={...s.c};
  if(p[1]==='K'){ c[col+'K']=0; c[col+'Q']=0; }
  for(const q of [m.f,m.t]){ if(q===0)c.bQ=0; if(q===7)c.bK=0; if(q===56)c.wQ=0; if(q===63)c.wK=0; }
  return {b,t:opp(col),c,ep:m.dbl?(m.f+m.t)/2:-1};
}
function inCheck(s){ const k=s.b.indexOf(s.t+'K'); return k>=0 && attacked(s.b,k,opp(s.t)); }
function legal(s){
  return pseudo(s,s.t).filter(m=>{
    const n=applyMove(s,m), k=n.b.indexOf(s.t+'K');
    return !attacked(n.b,k,opp(s.t));
  });
}
const sqn=i=>'abcdefgh'[i&7]+(8-(i>>3));

$('#invNo').onclick=async()=>{
  $('#inv').classList.add('hidden');
  try{ await mutate(d=>{ if(d.game&&d.game.status==='invite') d.game=null; d.log.push({ts:Date.now(),u:me.u,e:'satranç davetini reddetti'}); }); }catch(e){}
};

function gameTick(){
  const g=db.game;
  // gelen davet
  if(g && g.status==='invite' && g.inviter!==me.u && Date.now()-g.ts<120000){
    $('#invT').textContent=g.inviter+' seninle satranç oynamak istiyor.';
    $('#inv').classList.remove('hidden');
    if(shownInv!==g.id){ shownInv=g.id; SFX.recv(); }
  }else $('#inv').classList.add('hidden');
  // davetim reddedildi / kapandı
  if(hadInvite && (!g || g.id!==hadInvite)){ hadInvite=null; toast('Davet reddedildi veya kapandı'); SFX.err(); }
  if(g && g.id===hadInvite && g.status==='playing') hadInvite=null;
  // oyun başladı
  const mine=myGame();
  if(mine && mine.status==='playing' && mine.id!==openedId){ openedId=mine.id; sel=null; prevLen=mine.moves.length; openChess(); SFX.ok(); }
  // rakip hamlesi sesi
  if(mine && prevG && prevG.id===mine.id && mine.moves.length>prevLen){
    const mover = mine.moves.length%2? mine.white : mine.black;
    if(mover!==me.u){
      if(mine.status==='over') (mine.res&&mine.res.w===me.u)?SFX.win():SFX.lose();
      else if(inCheck(mine.s)) SFX.check(); else SFX.move();
    }
    prevLen=mine.moves.length;
  }
  if(mine && mine.status==='over' && prevG && prevG.status==='playing' && prevG.moves.length===mine.moves.length){ (mine.res&&mine.res.w===me.u)?SFX.win():SFX.lose(); }
  prevG=mine?JSON.parse(JSON.stringify(mine)):null;
  // üst çubuk
  const gb=$('#gbar');
  if(mine && mine.status==='playing' && $('#chess').classList.contains('hidden')){
    gb.classList.remove('hidden'); $('#gbarTxt').textContent='Satranç devam ediyor'+(mine.s.t===(mine.white===me.u?'w':'b')?' — sıra sende':'');
  }else gb.classList.add('hidden');
  if(!$('#chess').classList.contains('hidden')) drawChess();
}
$('#gbarBtn').onclick=()=>openChess();
function openChess(){ $('#chess').classList.remove('hidden'); drawChess(); gameTick(); }
$('#chClose').onclick=()=>{ $('#chess').classList.add('hidden'); gameTick(); };
$('#chResign').onclick=async()=>{
  const g=myGame(); if(!g) return;
  if(g.status==='over'){ $('#chess').classList.add('hidden'); return; }
  if(!confirm('Teslim olmak istediğine emin misin?')) return;
  const ng={...g,status:'over',res:{w:opp2(g),why:'teslim'}};
  db.game=ng; drawChess(); SFX.lose();
  try{ await mutate(d=>{ if(d.game&&d.game.id===g.id&&d.game.status==='playing'){ d.game=ng; d.log.push({ts:Date.now(),u:me.u,e:'satrançta teslim oldu'}); } }); }catch(e){}
};
const opp2=g=>g.white===me.u?g.black:g.white;

function drawChess(){
  const g=myGame(); if(!g){ $('#chess').classList.add('hidden'); return; }
  const side=g.white===me.u?'w':'b', flip=side==='b';
  $('#chT').textContent=`${g.white} (beyaz)  vs  ${g.black} (siyah)`;
  const s=g.s, mm=sel!=null?selMoves:[];
  const targets=new Map(mm.map(m=>[m.t,m]));
  let h='';
  for(let i=0;i<64;i++){
    const idx=flip?63-i:i, r=idx>>3, c=idx&7, p=s.b[idx];
    let cl='sq '+(((r+c)%2)?'d':'l');
    if(g.last&&(g.last[0]===idx||g.last[1]===idx)) cl+=' last';
    if(sel===idx) cl+=' sel';
    if(targets.has(idx)) cl+=p?' cap2':' dot';
    h+=`<div class="${cl}" data-i="${idx}">${p?`<span class="${p[0]==='w'?'pw':'pb'}">${GL[p[1]]}\uFE0E</span>`:''}</div>`;
  }
  const bd=$('#board'); bd.innerHTML=h;
  bd.querySelectorAll('.sq').forEach(el=>el.onclick=()=>tapSq(+el.dataset.i));
  let st;
  if(g.status==='over'){
    const r=g.res||{};
    st = r.w ? (r.w===me.u?'Kazandın':r.w+' kazandı')+' — '+r.why : 'Berabere — '+(r.why||'');
    $('#chResign').textContent='Kapat';
  }else{
    const mine=s.t===side;
    st=(mine?'Sıra sende':'Sıra '+opp2(g)+'’de')+(inCheck(s)?' — ŞAH!':'');
    $('#chResign').textContent='Teslim ol';
  }
  $('#chSt').textContent=st;
  $('#chMv').textContent=g.moves.slice(-12).join('  ');
}
function tapSq(i){
  const g=myGame(); if(!g||g.status!=='playing') return;
  const side=g.white===me.u?'w':'b', s=g.s;
  if(s.t!==side) return;
  const target=selMoves.filter(m=>m.t===i);
  if(sel!=null && target.length){
    makeMove(g, target.find(m=>m.pr==='Q')||target[0]); return;
  }
  const p=s.b[i];
  if(p && p[0]===side){ sel=i; selMoves=legal(s).filter(m=>m.f===i); SFX.click(); }
  else { sel=null; selMoves=[]; }
  drawChess();
}
async function makeMove(g,m){
  const n=applyMove(g.s,m);
  const coord=sqn(m.f)+sqn(m.t)+(m.pr?m.pr.toLowerCase():'');
  let ng={...g,s:n,moves:[...g.moves,coord],last:[m.f,m.t]};
  const lm=legal(n), chk=inCheck(n);
  if(!lm.length){
    ng.status='over';
    ng.res = chk?{w:me.u,why:'şah mat'}:{w:null,why:'pat'};
    (chk?SFX.win:SFX.ok)();
  }else if(chk) SFX.check(); else if(m.cap) SFX.cap(); else SFX.move();
  sel=null; selMoves=[]; db.game=ng; prevLen=ng.moves.length;
  drawChess(); gameTick();
  try{
    await mutate(d=>{
      if(d.game && d.game.id===g.id && d.game.moves.length===g.moves.length){
        d.game=ng;
        if(ng.status==='over') d.log.push({ts:Date.now(),u:me.u,e:'satranç bitti: '+ng.res.why});
      }
    });
  }catch(e){ toast('Hamle gönderilemedi'); }
}


/* ---------- Menü ---------- */
function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); drawDrawer(); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#menuBtn').onclick=openDrawer; $('#closeDrawer').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
document.querySelectorAll('.dtabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('.dtabs button').forEach(x=>x.classList.toggle('on',x===b));
  drawDrawer();
});
async function drawDrawer(){
  const el=$('#dbody');
  if(tab==='users'){
    const rows=Object.entries(db.users).map(([n,u])=>{
      const cnt=db.messages.filter(m=>m.from===n).length;
      return `<div class="item"><b>${esc(n)}${n===me.u?' (sen)':''}</b>
        <small><i class="dot ${isOnline(u)?'on':''}"></i> ${isOnline(u)?'çevrimiçi':'çevrimdışı'}</small>
        <small>Son görülme: ${u.lastSeen?full(u.lastSeen):'—'}</small>
        <small>Kayıt: ${u.created?full(u.created):'—'}</small>
        <small>Gönderdiği mesaj: ${cnt}</small>
        <small>Şifreleme anahtarı: ${u.pub?'var':'yok (giriş yapması gerek)'}</small>
        <small>Yapay zeka yanıtı: ${u.ai?'açık':'kapalı'}</small></div>`;
    }).join('');
    const aiOn=!!(db.users[me.u]&&db.users[me.u].ai);
    el.innerHTML = `<div class="item"><b>Uçtan uca şifreleme</b>
        <small>Mesajlar ve fotoğraflar yalnızca iki cihazda çözülür.</small>
        <small>Güvenlik kodu:</small><b id="safe" style="letter-spacing:.06em">…</b>
        <small>Bu kodun iki telefonda da aynı olduğunu bir kez karşılaştır.</small>
        ${keyWarn?'<button class="sw" id="fpOk" style="margin-top:10px">Karşı tarafın yeni anahtarını onayla</button>':''}</div>
      ${wxCard()}
      <button class="sw ${asstOn(me.u)?'on':''}" id="asSw">Ortak asistan (otomatik araştırma): ${asstOn(me.u)?'AÇIK':'KAPALI'}</button>
      <small style="display:block;color:#6b6b6b;margin:6px 0 14px;font-size:11px">Sohbeti anlayıp konuyu araştırır, sana adınla hitap ederek sohbet odasında paylaşır. İki tarafın da açması gerekir${peer()?' ('+esc(peer().name)+': '+(asstOn(peer().name)?'açık':'kapalı')+')':''}. Bu sırada sohbet metni şifresiz servislere gider.</small>
      <button class="sw ${aiOn?'on':''}" id="aiSw">Yapay zeka yanıtı: ${aiOn?'AÇIK':'KAPALI'}</button>
      <small style="display:block;color:#6b6b6b;margin:6px 0 14px;font-size:11px">Açıkken sen çevrimdışıysan yapay zeka senin adına "yapay zeka yanıtı" etiketiyle cevap verir. Bu mesajlar şifresiz bir servise gider.</small>`
      + (rows || '<div class="empty">Kullanıcı yok.</div>');
    $('#aiSw').onclick=toggleAI; $('#asSw').onclick=toggleAsst; $('#wFind').onclick=wxFind; $('#wGeo').onclick=wxGeo; $('#wSw').onclick=wxToggle; $('#wNow').onclick=wxNow;
    const fo=$('#fpOk'); if(fo) fo.onclick=()=>{ const p=peer(); localStorage.setItem('sh_fp_'+me.u,p.name+':'+p.pub.x); keyWarn=false; toast('Yeni anahtar onaylandı'); drawDrawer(); };
    const sc=await safetyCode(); const s=$('#safe'); if(s) s.textContent=sc||'karşı kullanıcı bekleniyor';
  }else if(tab==='search'){
    el.innerHTML=searchHtml(); bindSearch(el);
  }else if(tab==='media'){
    const ms=db.messages.map(m=>({m,P:dcache.get(m.id)})).filter(x=>x.P&&(x.P.type==='image'||x.P.type==='video')).reverse();
    el.innerHTML = ms.length ? '<div class="grid">'+ms.map(({m,P})=>{
      const who=`<span>${esc(m.from)}</span>`;
      if(P.type==='image') return `<div class="g"><img data-zoom src="${esc(P.data)}">${who}</div>`;
      return `<div class="g">${vidHtml(m.id,P,m.from)}${who}</div>`;
    }).join('')+'</div>' : '<div class="empty">Henüz fotoğraf veya video yok.</div>';
    hydrate(el);
  }else{
    const rows=[...db.log].reverse().map(l=>`<div class="logrow"><b>${esc(l.u)}</b> ${esc(l.e)}<time>${full(l.ts)}</time></div>`).join('');
    el.innerHTML = rows || '<div class="empty">Etkinlik yok.</div>';
  }
}

/* ---------- Ses & çıkış ---------- */
function paintMute(){ $('#muteIcon').style.opacity = muted?.35:1; }
$('#muteBtn').onclick=()=>{ muted=!muted; localStorage.setItem('sh_mute',muted?'1':'0'); paintMute(); toast(muted?'Ses kapalı':'Ses açık'); if(!muted) SFX.ok(); };
paintMute();

function logout(){
  clearTimeout(pollT); clearInterval(beatT);
  localStorage.removeItem('sh_me'); me=null; myPriv=null; dcache.clear(); keyWarn=false; aiLocal=null; aiRun=false; pending.clear(); closeDrawer();
  if(rx){ try{rx.pc.close();}catch(e){} rx=null; } hideProg();
  $('#chess').classList.add('hidden'); $('#inv').classList.add('hidden'); $('#gbar').classList.add('hidden'); openedId=null;
  $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden');
  $('#p').value=''; drawSlots();
}
$('#logout').onclick=logout;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && me){ poll(); heartbeat(); } });

/* ---------- Açılış ---------- */
(async function boot(){
  const t0=Date.now();
  try{ SFX.start(); }catch(e){}
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('sh_me')||'null'); }catch(e){}
  let ok=false, netErr=null;
  try{
    db = await readDb();
    if(saved && db.users[saved.u] && db.users[saved.u].auth && db.users[saved.u].auth===saved.h){
      const k=await idbGet('priv:'+saved.u).catch(()=>null);
      if(k){ myPriv=k; me=saved; ok=true; }
    }
  }catch(e){ netErr=e.message; }
  const wait=Math.max(0,3000-(Date.now()-t0));
  setTimeout(()=>{
    $('#splash').classList.add('out');
    setTimeout(()=>$('#splash').remove(),550);
    if(ok){ enterApp(); heartbeat(); }
    else{ $('#auth').classList.remove('hidden'); drawSlots(); if(netErr) showErr('Bağlantı hatası: '+netErr); }
  },wait);
})();
</script>
