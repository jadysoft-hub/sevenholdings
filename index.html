<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Seven Holdings Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#6b6b6b; --line:#d9d9d9; --soft:#f3f3f3;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;background:#000;color:#fff;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .5s ease;
}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:92px;height:92px;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em;animation:fade 1s .35s both}
#splash .bar{width:140px;height:3px;background:#333;border-radius:3px;overflow:hidden}
#splash .bar i{display:block;height:100%;background:#fff;width:0;animation:load 3s linear forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}

/* ---------- Auth ---------- */
#auth{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--bg);overflow:auto;
}
.card{
  width:100%;max-width:400px;border:1.5px solid var(--ink);border-radius:var(--r);
  padding:22px;position:relative;background:#fff;
}
.card::before{content:"";position:absolute;left:-1.5px;top:18px;bottom:18px;width:5px;background:var(--ink);border-radius:0 4px 4px 0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand svg{width:40px;height:40px}
.brand b{font-size:18px;font-weight:800}
.kicker{color:var(--muted);font-size:12px;margin:0 0 4px}
h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;
}
input:focus{border-color:var(--ink)}
.primary{
  width:100%;margin-top:18px;padding:13px;border-radius:12px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;font-weight:800;
}
.primary:disabled{opacity:.5}
.err{color:#000;background:var(--soft);border:1.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px}
.slots{display:flex;gap:6px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center}
.slots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.slots i.f{background:var(--ink)}

/* ---------- App ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
header{
  display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1.5px solid var(--ink);background:#fff;
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;
  display:grid;place-items:center;flex:none;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{background:var(--ink)}
.icon-btn:active svg{stroke:#fff}
.peer{flex:1;min-width:0}
.peer b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.dot.on{background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(0,0,0,.15)}}

#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft);-webkit-overflow-scrolling:touch}
.day{align-self:center;font-size:11px;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:2px 10px;margin:6px 0}
.m{max-width:82%;padding:9px 12px;border-radius:16px;border:1.5px solid var(--ink);word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.m .t{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.m img,.m video,.m iframe{display:block;max-width:100%;border-radius:10px;background:#000;border:0}
.m iframe{width:260px;height:150px}
.m img{cursor:zoom-in;max-height:300px}
.m video{max-height:300px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}

#composer{
  display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1.5px solid var(--ink);background:#fff;
}
#composer input[type=text]{flex:1;min-width:0;border-radius:22px;padding:12px 16px}
.send{width:46px;height:46px;border-radius:50%;background:var(--ink);border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;stroke:#fff}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(92vw,380px);background:#fff;border-right:1.5px solid var(--ink);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:50;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1.5px solid var(--ink)}
.dh b{flex:1;font-size:16px;font-weight:800}
.dtabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.dtabs button{flex:1;padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:700}
.dtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:12px}
.item{border:1.5px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:10px;position:relative;padding-left:16px}
.item::before{content:"";position:absolute;left:-1.5px;top:10px;bottom:10px;width:4px;background:var(--ink);border-radius:0 3px 3px 0}
.item small{display:block;color:var(--muted);font-size:11px}
.item b{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid .g{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1;position:relative}
.grid .g img,.grid .g video{width:100%;height:100%;object-fit:cover;display:block}
.grid .g span{position:absolute;left:6px;bottom:6px;background:#fff;color:#000;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700}
.logrow{font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.logrow time{color:var(--muted);display:block;font-size:11px}
.dfoot{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);display:flex;gap:8px}
.dfoot button{flex:1;padding:11px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:700}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;z-index:95;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="21" y="5" width="22" height="14" rx="3"/>
    <path d="M32 19v8M14 27h36M14 27v7M50 27v7"/>
    <rect x="4" y="34" width="20" height="12" rx="6"/><path d="M4 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
    <rect x="40" y="34" width="20" height="12" rx="6"/><path d="M40 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
  </svg>
  <h1>Seven Holdings Inc.</h1>
  <div class="bar"><i></i></div>
</div>

<!-- Auth -->
<div id="auth" class="hidden">
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="21" y="5" width="22" height="14" rx="3"/><path d="M32 19v8M14 27h36M14 27v7M50 27v7"/>
        <rect x="4" y="34" width="20" height="12" rx="6"/><path d="M4 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
        <rect x="40" y="34" width="20" height="12" rx="6"/><path d="M40 40v9c0 3 4 5 10 5s10-2 10-5v-9"/>
      </svg>
      <b>Seven Holdings Inc.</b>
    </div>
    <p class="kicker">Özel mesajlaşma</p>
    <h2 id="authTitle">Giriş yap</h2>
    <p class="sub">Yalnızca iki hesap oluşturulabilir.</p>
    <div class="tabs">
      <button id="tabLogin" class="on">Giriş</button>
      <button id="tabReg">Kayıt</button>
    </div>
    <label for="u">Kullanıcı adı</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="p">Şifre</label>
    <input id="p" type="password" autocomplete="current-password">
    <div id="authErr" class="err hidden"></div>
    <button id="authBtn" class="primary">Giriş yap</button>
    <div class="slots" id="slots"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="peer">
      <b id="peerName">Bekleniyor…</b>
      <span><i class="dot" id="peerDot"></i><em id="peerStatus" style="font-style:normal">çevrimdışı</em></span>
    </div>
    <button class="icon-btn" id="muteBtn" aria-label="Ses">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <div id="msgs"></div>

  <form id="composer" autocomplete="off">
    <button type="button" class="icon-btn" id="imgBtn" aria-label="Fotoğraf">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
    </button>
    <button type="button" class="icon-btn" id="vidBtn" aria-label="Video bağlantısı">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" class="hidden">
    <input type="text" id="txt" placeholder="Mesaj yaz" enterkeyhint="send">
    <button class="send" type="submit" aria-label="Gönder">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>

<!-- Drawer -->
<div id="scrim"></div>
<aside id="drawer">
  <div class="dh">
    <b>Seven Holdings Inc.</b>
    <button class="icon-btn" id="closeDrawer" aria-label="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dtabs">
    <button data-t="users" class="on">Kullanıcılar</button>
    <button data-t="media">Medya</button>
    <button data-t="log">Etkinlik</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot"><button id="logout">Çıkış yap</button></div>
</aside>

<div id="lightbox" class="hidden"></div>

<script>
/* ================= AYARLAR ================= */
const MASTER_KEY = '$2a$10$VMG16LdoXNA/B834M56Yn.yqpKgTJriDmNO4IuO.JaYb3CmDCMrau';
const BIN_NAME   = 'seven-holdings-chat';
const MAX_USERS  = 2;
const POLL_MS    = 4000;     // mesaj kontrol süresi
const BEAT_MS    = 25000;    // "çevrimiçi" sinyali
const ONLINE_MS  = 65000;    // bu süre içinde sinyal varsa çevrimiçi
const MAX_BYTES  = 92000;    // JSONBin ücretsiz limit ~100KB
/* ========================================== */

const API = 'https://api.jsonbin.io/v3';
const $ = s => document.querySelector(s);
let binId = localStorage.getItem('sh_bin') || null;
let db = { users:{}, messages:[], log:[] };
let me = null;            // {u, h}
let mode = 'login';
let tab = 'users';
let lastSig = '';
let muted = localStorage.getItem('sh_mute') === '1';

/* ---------- Ses efektleri (WebAudio) ---------- */
let AC;
function tone(seq){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    let t = AC.currentTime;
    seq.forEach(([f,d,type='sine',v=.15])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
      t+=d*.8;
    });
  }catch(e){}
}
const SFX = {
  start:()=>tone([[392,.12],[523,.12],[784,.3]]),
  click:()=>tone([[660,.05,'square',.05]]),
  send:()=>tone([[520,.07],[780,.1]]),
  recv:()=>tone([[880,.1],[660,.1],[990,.16]]),
  ok:()=>tone([[523,.1],[659,.1],[784,.18]]),
  err:()=>tone([[220,.18,'sawtooth',.1],[165,.25,'sawtooth',.1]]),
  online:()=>tone([[600,.08],[900,.14]]),
};
document.addEventListener('click',e=>{ if(e.target.closest('button')) SFX.click(); },true);

function toast(msg){
  const t=document.createElement('div'); t.id='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ---------- JSONBin ---------- */
async function jb(method, path, body, extra={}){
  const r = await fetch(API+path,{
    method,
    headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY,'X-Bin-Meta':'false',...extra},
    body: body?JSON.stringify(body):undefined
  });
  if(!r.ok){
    let m=''; try{ m=(await r.json()).message }catch(e){}
    throw new Error('JSONBin '+r.status+' '+m);
  }
  return r.json();
}
async function ensureBin(){
  if(binId) return;
  try{
    const list = await fetch(API+'/c/uncategorized/bins',{headers:{'X-Master-Key':MASTER_KEY}}).then(r=>r.ok?r.json():[]);
    const found = (Array.isArray(list)?list:[]).find(b=>b.snippetMeta && b.snippetMeta.name===BIN_NAME);
    if(found){ binId=found.record; }
  }catch(e){}
  if(!binId){
    const created = await fetch(API+'/b',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY,'X-Bin-Name':BIN_NAME,'X-Bin-Private':'true'},
      body:JSON.stringify({users:{},messages:[],log:[]})
    }).then(r=>r.json());
    binId = created.metadata.id;
  }
  localStorage.setItem('sh_bin',binId);
}
async function readDb(){
  await ensureBin();
  const d = await jb('GET','/b/'+binId+'/latest');
  d.users=d.users||{}; d.messages=d.messages||[]; d.log=d.log||[];
  return d;
}
let queue = Promise.resolve();
function mutate(fn){
  const run = async()=>{
    const d = await readDb();
    fn(d);
    d.log = d.log.slice(-60);
    while(JSON.stringify(d).length > MAX_BYTES && d.messages.length>1) d.messages.shift();
    await jb('PUT','/b/'+binId, d);
    db = d;
    return d;
  };
  const p = queue.then(run, run);
  queue = p.catch(()=>{});
  return p;
}

/* ---------- Yardımcılar ---------- */
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hm  = ts => new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const dm  = ts => new Date(ts).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const full= ts => new Date(ts).toLocaleString('tr-TR');
const isOnline = u => u && (Date.now()-(u.lastSeen||0) < ONLINE_MS);
function peer(){ const n=Object.keys(db.users).find(k=>k!==(me&&me.u)); return n?{name:n,...db.users[n]}:null; }

/* ---------- Auth ---------- */
function setMode(m){
  mode=m;
  $('#tabLogin').classList.toggle('on',m==='login');
  $('#tabReg').classList.toggle('on',m==='reg');
  $('#authTitle').textContent = m==='login'?'Giriş yap':'Hesap oluştur';
  $('#authBtn').textContent   = m==='login'?'Giriş yap':'Kayıt ol';
  $('#p').autocomplete = m==='login'?'current-password':'new-password';
  $('#authErr').classList.add('hidden');
}
$('#tabLogin').onclick=()=>setMode('login');
$('#tabReg').onclick=()=>setMode('reg');

function showErr(m){ const e=$('#authErr'); e.textContent=m; e.classList.remove('hidden'); SFX.err(); }
function drawSlots(){
  const n=Object.keys(db.users).length;
  $('#slots').innerHTML = Array.from({length:MAX_USERS},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')
    + `<span>${n}/${MAX_USERS} hesap kayıtlı</span>`;
}

$('#authBtn').onclick = async ()=>{
  const u = $('#u').value.trim().toLowerCase();
  const p = $('#p').value;
  if(u.length<3) return showErr('Kullanıcı adı en az 3 karakter olmalı.');
  if(!/^[a-z0-9_.-]+$/.test(u)) return showErr('Kullanıcı adında yalnızca harf, rakam, _ . - kullan.');
  if(p.length<4) return showErr('Şifre en az 4 karakter olmalı.');
  const btn=$('#authBtn'); btn.disabled=true;
  try{
    const h = await sha(u+':'+p);
    if(mode==='reg'){
      let err=null;
      await mutate(d=>{
        if(d.users[u]){ err='Bu kullanıcı adı zaten alınmış.'; return; }
        if(Object.keys(d.users).length>=MAX_USERS){ err='Kayıt dolu. En fazla '+MAX_USERS+' kullanıcı kayıt olabilir.'; return; }
        d.users[u]={hash:h,created:Date.now(),lastSeen:Date.now()};
        d.log.push({ts:Date.now(),u,e:'kayıt oldu'});
      });
      if(err) return showErr(err);
    }else{
      const d = await readDb(); db=d;
      if(!d.users[u] || d.users[u].hash!==h) return showErr('Kullanıcı adı veya şifre hatalı.');
      await mutate(x=>{ x.users[u].lastSeen=Date.now(); x.log.push({ts:Date.now(),u,e:'giriş yaptı'}); });
    }
    me={u,h};
    localStorage.setItem('sh_me',JSON.stringify(me));
    SFX.ok(); enterApp();
  }catch(e){ showErr('Bağlantı hatası: '+e.message); }
  finally{ btn.disabled=false; }
};
['#u','#p'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') $('#authBtn').click(); }));

/* ---------- Uygulama ---------- */
let pollT, beatT, firstRender=true;
function enterApp(){
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  firstRender=true; lastSig='';
  render(); poll();
  clearInterval(pollT); clearInterval(beatT);
  pollT=setInterval(()=>{ if(!document.hidden) poll(); },POLL_MS);
  beatT=setInterval(()=>{ if(!document.hidden) heartbeat(); },BEAT_MS);
}
async function heartbeat(){
  try{ await mutate(d=>{ if(d.users[me.u]) d.users[me.u].lastSeen=Date.now(); }); sync(); }catch(e){}
}
let prevPeerOnline=null;
async function poll(){
  try{
    const d = await readDb();
    if(!d.users[me.u] || d.users[me.u].hash!==me.h){ return logout(); }
    const oldIds = new Set(db.messages.map(m=>m.id));
    const fresh = d.messages.filter(m=>!oldIds.has(m.id) && m.from!==me.u);
    db=d;
    if(fresh.length && !firstRender) SFX.recv();
    sync();
  }catch(e){}
}
function sync(){
  const p=peer(); const on=isOnline(p);
  if(prevPeerOnline===false && on) SFX.online();
  prevPeerOnline=on;
  render();
}
function render(){
  const p=peer(), on=isOnline(p);
  $('#peerName').textContent = p?p.name:'Karşı kullanıcı bekleniyor';
  $('#peerDot').classList.toggle('on',on);
  $('#peerStatus').textContent = !p?'henüz kayıt olmadı': on?'çevrimiçi':'son görülme '+(p.lastSeen?hm(p.lastSeen):'—');

  const sig = db.messages.length+':'+(db.messages.at(-1)||{}).id;
  if(sig!==lastSig){
    lastSig=sig;
    const box=$('#msgs');
    const near = box.scrollHeight-box.scrollTop-box.clientHeight < 140 || firstRender;
    let html='', lastDay='';
    if(!db.messages.length) html='<div class="empty">Henüz mesaj yok.<br>İlk mesajı yaz, fotoğraf ekle ya da video bağlantısı paylaş.</div>';
    db.messages.forEach(m=>{
      const day=dm(m.ts); if(day!==lastDay){ html+=`<div class="day">${day}</div>`; lastDay=day; }
      html+=`<div class="m ${m.from===me.u?'me':'them'}">${body(m)}<span class="t">${hm(m.ts)}</span></div>`;
    });
    box.innerHTML=html;
    if(near) box.scrollTop=box.scrollHeight;
    box.querySelectorAll('img[data-zoom]').forEach(i=>i.onclick=()=>openBox(i.src));
  }
  if($('#drawer').classList.contains('on')) drawDrawer();
  firstRender=false;
}
function ytId(u){
  const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m?m[1]:null;
}
function body(m){
  if(m.type==='image') return `<img data-zoom src="${m.data}" alt="fotoğraf">`;
  if(m.type==='video'){
    const y=ytId(m.data);
    if(y) return `<iframe src="https://www.youtube.com/embed/${y}" allowfullscreen loading="lazy"></iframe>`;
    return `<video controls playsinline preload="metadata" src="${esc(m.data)}"></video>`;
  }
  return esc(m.text||'');
}
function openBox(src){ const l=$('#lightbox'); l.innerHTML=`<img src="${src}">`; l.classList.remove('hidden'); l.onclick=()=>l.classList.add('hidden'); }

/* ---------- Gönderme ---------- */
async function send(msg){
  const m={id:uid(),from:me.u,ts:Date.now(),...msg};
  db.messages.push(m); lastSig=''; render(); SFX.send();
  $('#msgs').scrollTop=$('#msgs').scrollHeight;
  try{
    await mutate(d=>{
      if(!d.messages.find(x=>x.id===m.id)) d.messages.push(m);
      d.users[me.u].lastSeen=Date.now();
      d.log.push({ts:m.ts,u:me.u,e:msg.type==='text'?'mesaj gönderdi':(msg.type==='image'?'fotoğraf gönderdi':'video paylaştı')});
    });
    lastSig=''; render();
  }catch(e){ toast('Gönderilemedi: '+e.message); SFX.err(); }
}
$('#composer').addEventListener('submit',e=>{
  e.preventDefault();
  const t=$('#txt').value.trim(); if(!t) return;
  $('#txt').value=''; send({type:'text',text:t});
});
$('#imgBtn').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ send({type:'image',data:await shrink(f)}); }catch(err){ toast('Fotoğraf okunamadı'); }
};
$('#vidBtn').onclick=()=>{
  const u=prompt('Video bağlantısı (mp4 linki veya YouTube):');
  if(!u) return;
  if(!/^https?:\/\//i.test(u.trim())) return toast('Geçerli bir http(s) bağlantısı gir');
  send({type:'video',data:u.trim()});
};
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let max=360, q=.6, out;
      do{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        max-=40; q-=.08;
      }while(out.length>28000 && max>120);
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror=rej; img.src=url;
  });
}

/* ---------- Menü ---------- */
function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); drawDrawer(); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#menuBtn').onclick=openDrawer; $('#closeDrawer').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
document.querySelectorAll('.dtabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('.dtabs button').forEach(x=>x.classList.toggle('on',x===b));
  drawDrawer();
});
function drawDrawer(){
  const el=$('#dbody');
  if(tab==='users'){
    const rows=Object.entries(db.users).map(([n,u])=>{
      const cnt=db.messages.filter(m=>m.from===n).length;
      return `<div class="item"><b>${esc(n)}${n===me.u?' (sen)':''}</b>
        <small><i class="dot ${isOnline(u)?'on':''}"></i> ${isOnline(u)?'çevrimiçi':'çevrimdışı'}</small>
        <small>Son görülme: ${u.lastSeen?full(u.lastSeen):'—'}</small>
        <small>Kayıt: ${u.created?full(u.created):'—'}</small>
        <small>Gönderdiği mesaj: ${cnt}</small></div>`;
    }).join('');
    el.innerHTML = rows || '<div class="empty">Kullanıcı yok.</div>';
  }else if(tab==='media'){
    const ms=db.messages.filter(m=>m.type!=='text').reverse();
    el.innerHTML = ms.length ? '<div class="grid">'+ms.map(m=>{
      const who=`<span>${esc(m.from)}</span>`;
      if(m.type==='image') return `<div class="g"><img data-zoom src="${m.data}">${who}</div>`;
      const y=ytId(m.data);
      return y?`<div class="g"><iframe src="https://www.youtube.com/embed/${y}" style="width:100%;height:100%;border:0" allowfullscreen></iframe>${who}</div>`
              :`<div class="g"><video controls playsinline preload="metadata" src="${esc(m.data)}"></video>${who}</div>`;
    }).join('')+'</div>' : '<div class="empty">Henüz fotoğraf veya video yok.</div>';
    el.querySelectorAll('img[data-zoom]').forEach(i=>i.onclick=()=>openBox(i.src));
  }else{
    const rows=[...db.log].reverse().map(l=>`<div class="logrow"><b>${esc(l.u)}</b> ${esc(l.e)}<time>${full(l.ts)}</time></div>`).join('');
    el.innerHTML = rows || '<div class="empty">Etkinlik yok.</div>';
  }
}

/* ---------- Ses & çıkış ---------- */
function paintMute(){ $('#muteIcon').style.opacity = muted?.35:1; }
$('#muteBtn').onclick=()=>{ muted=!muted; localStorage.setItem('sh_mute',muted?'1':'0'); paintMute(); toast(muted?'Ses kapalı':'Ses açık'); if(!muted) SFX.ok(); };
paintMute();

function logout(){
  clearInterval(pollT); clearInterval(beatT);
  localStorage.removeItem('sh_me'); me=null; closeDrawer();
  $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden');
  $('#p').value=''; drawSlots();
}
$('#logout').onclick=logout;
window.addEventListener('beforeunload',()=>{ /* son görülme sunucuda kalır */ });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && me){ poll(); heartbeat(); } });

/* ---------- Açılış ---------- */
(async function boot(){
  const t0=Date.now();
  try{ SFX.start(); }catch(e){}
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('sh_me')||'null'); }catch(e){}
  let ok=false, netErr=null;
  try{
    db = await readDb();
    if(saved && db.users[saved.u] && db.users[saved.u].hash===saved.h){ me=saved; ok=true; }
  }catch(e){ netErr=e.message; }
  const wait=Math.max(0,3000-(Date.now()-t0));
  setTimeout(()=>{
    $('#splash').classList.add('out');
    setTimeout(()=>$('#splash').remove(),550);
    if(ok){ enterApp(); heartbeat(); }
    else{ $('#auth').classList.remove('hidden'); drawSlots(); if(netErr) showErr('Bağlantı hatası: '+netErr); }
  },wait);
})();
</script>
</body>
</html>
